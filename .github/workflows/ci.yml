name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  run-tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: NixOS/nix-installer-action@52a8353f0f360b7caa0b5c24655de8108f07c169 # 1.0.0
        with:
          extra-conf: | # Required to run `nix flake check`
            experimental-features = nix-command flakes
      - name: Run Checks
        run: nix flake check
